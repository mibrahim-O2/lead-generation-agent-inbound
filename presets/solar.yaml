# Niche preset: solar equipment + installation (layer 2 of the config stack).
# defaults (src/leadgen/config.py) -> THIS FILE -> config/client.yaml
# All company-specific values live in config/client.yaml, so another solar
# client only edits that file. Another niche copies this file and edits it.
niche: solar

company:
  about: >-
    Solar equipment supplier and installer for homes, businesses, factories
    and farms.
  services:
    - Solar panels
    - Inverters (on-grid and hybrid)
    - Batteries
    - Installation
    - Net metering application support
  customers: [homes, businesses, factories, farms]

calendar_link: https://example.com/book-a-call  # placeholder

tone:
  style: >-
    Warm, respectful and practical. Short sentences, no jargon, no pressure.
    Reply in the language the customer used: English for English, Roman Urdu
    for Roman Urdu. Use Urdu script only if the customer wrote in Urdu script.
  languages: [english, roman_urdu]
  sign_off: Customer Care Team
  max_questions: 3          # per draft reply
  max_questions_nurture: 1  # per nurture draft (keep it short)
  max_chars_nurture: 700    # a nurture draft is a short note

working_hours:
  timezone: Asia/Karachi
  days: Monday to Saturday
  hours: "09:00 to 18:00"

# Questions the code may hand to the agent, in priority order. The code works
# out which fields are really missing (from the extracted fields and the contact
# details on file) and passes on only those, up to tone.max_questions.
qualification_questions:
  - field: contact            # only when the lead has no email and no phone
    question: What is the best phone number or email to reach you on?
    question_roman_urdu: Aap se rabta karne ke liye behtareen number ya email kya hai?
  - field: monthly_bill_pkr   # skipped when the bill or the sanctioned load is known
    question: Roughly how much is your average monthly electricity bill?
    question_roman_urdu: Aap ka mahana bijli ka bill taqreeban kitna aata hai?
  - field: location
    question: Which city and area is the property in?
    question_roman_urdu: Property kis sheher aur area mein hai?
  - field: timeline
    question: When would you like to have the system installed?
    question_roman_urdu: Aap system kab tak lagwana chahte hain?
  - field: property_type
    question: Is the system for a home, a business, a factory or a farm?
    question_roman_urdu: System ghar, business, factory ya farm ke liye chahiye?
  - field: product_interest
    question: >-
      Are you interested in a complete system, or specific items such as
      panels, an inverter or batteries?
    question_roman_urdu: >-
      Aap ko complete system chahiye ya sirf panels, inverter ya battery?

# Code-level safety net: if the model leaves a field unknown but the message
# clearly states it, these patterns fill it in. They never override the model.
extraction_hints:
  property_type:
    factory: ['\b(factory|textile|mill|industrial|manufacturing|warehouse|cold storage)\b']
    farm: ['\b(farm|tube ?well|agricultur\w*|dairy|poultry|khet|zameen)\b']
    business: ['\b(office|shop|school|hospital|restaurant|plaza|commercial|clinic|hotel|showroom|dukaan)\b']
    home: ['\b(house|home|ghar|makan|kanal|marla|residence|residential|apartment|flat|bungalow|villa)\b']
  product_interest:
    panels: ['\bpanels?\b']
    inverter: ['\binverters?\b']
    battery: ['\bbatter(y|ies)\b']
    net metering: ['\bnet[- ]?metering\b']
    hybrid system: ['\bhybrid\b']
    on-grid system: ['\bon[- ]?grid\b']
    solar system: ['\b\d+(\.\d+)?\s*kw\b.{0,20}\bsystem\b', '\bsolar system\b', '\bcomplete system\b']
  timeline:
    later: ['\b(next year|agle saal|just exploring|only exploring|no rush|not in a hurry|someday|baad mein)\b']

# Score = sum of points, clamped to 1..10. "Hot" means score >= hot_threshold.
# Five signals: property type, energy size (bill OR sanctioned load, whichever
# gives more points), location fit, timeline, intent (quote OR site visit,
# whichever gives more points).
scoring:
  hot_threshold: 7
  min_score: 1
  max_score: 10
  rubric:
    property_type:
      factory: 3
      business: 2
      farm: 2
      home: 2
      unknown: 0
    monthly_bill_pkr:        # highest band whose "min" the bill reaches
      - {min: 100000, points: 3}
      - {min: 50000, points: 2}
      - {min: 20000, points: 1}
    sanctioned_load_kw:      # sanctioned / connected load in kW, same idea
      - {min: 100, points: 3}   # industrial scale
      - {min: 25, points: 2}    # commercial scale
      - {min: 10, points: 1}    # large home or small shop
    location:                # fit against service_area below
      core: 2
      nearby: 1
      outside: 0
      unknown: 0
    timeline:
      immediate: 2           # this month / as soon as possible
      within_3_months: 1
      later: 0
      unknown: 0
    quote_requested: 1       # asked for a quote or a price
    site_visit_requested: 2  # asked for a site visit or survey: strong intent

service_area:
  core: [lahore, dha, gulberg, johar town, model town, bahria, raiwind, cantt]
  nearby: [kasur, sheikhupura, gujranwala, muridke, pattoki, nankana]

# Added to the built-in triggers (merged by id).
handover_triggers:
  - id: safety_incident
    description: Fire, shock or damage reported
    patterns:
      - '\b(fire|burn(t|ing)|spark(s|ing)?|electric shock|short circuit)\b'
      - '\b(roof|ceiling) (leak|damage|crack)'
  - id: existing_customer_fault
    description: Fault on an already installed system
    patterns:
      - '\b(inverter|panel|battery|system)\b.{0,40}\b(fault|faulty|stopped working|kharab|band ho)'

# Added to the built-in forbidden claims (merged by id).
forbidden_claims:
  - id: net_metering_approval
    description: Promising net-metering approval or its timing
    fix: >-
      Do not say or imply that net metering will be approved, or how fast. Say
      the distribution company makes that decision.
    # A negated sentence ("we cannot say whether it will be approved") is the
    # honest disclaimer, not a promise, so it is allowed.
    allow_negated: true
    patterns:
      - 'net[- ]metering.{0,60}\b(will (definitely |surely |certainly |easily |quickly )?be approved|(is|gets|get) (always |usually |easily |quickly )?approved|approved (in|within|by)\b)'
      - 'net[- ]metering.{0,60}\bapproval is (guaranteed|certain|assured|easy|quick|fast|simple|a formality|no problem)'
      - '\b(definitely|certainly|surely)\b.{0,40}net[- ]metering'
      - '\b(assure|ensure)\b.{0,40}net[- ]metering.{0,30}approv'

# When a genuine lead is "nurture" (not ready yet) and not "draft_reply".
# Decided in code from the facts, after the model's decision. A hot lead is never
# nurture.
nurture:
  enabled: true
  timelines: [later]                   # e.g. "next year", "just exploring"
  max_score: 5                         # never nurture a lead scoring above this
  block_if_quote_requested: true       # asked for a quote or price -> draft_reply
  block_if_site_visit_requested: true  # asked for a site visit -> draft_reply

duplicate_route: handover

# Placeholder token prices for the cost ESTIMATE only. Set your model's real
# prices in config/client.yaml.
pricing:
  input_per_1m_usd: 0.0
  output_per_1m_usd: 0.0
