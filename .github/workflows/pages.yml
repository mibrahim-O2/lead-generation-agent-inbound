name: Deploy dashboard to GitHub Pages

# Builds the dashboard in DEMO mode (bundled dummy data, no API, no secrets)
# and publishes it. One-time setup: repository Settings > Pages > Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (demo mode)
        run: npm run build
        env:
          # A project site is served from /<repository name>/.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Deliberately empty: the published site never talks to an API.
          VITE_API_URL: ""
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
